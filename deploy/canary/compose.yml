# Canary : la version stable reçoit presque tout, la nouvelle version un petit pourcentage.
services:
  stable:
    image: ${STABLE_IMAGE:-shipit:1.0.0}
  canary:
    image: ${CANARY_IMAGE:-shipit:1.1.0}
  proxy:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [stable, canary]
